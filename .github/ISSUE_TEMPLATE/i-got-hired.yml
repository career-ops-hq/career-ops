name: "I Got Hired!"
description: Share your success story — you landed a job using career-ops
labels: ["hired"]
title: "I got hired 🎉"
body:
  - type: markdown
    attributes:
      value: |
        Congrats on the new role! Your story helps others see what's possible.
  - type: input
    id: role
    attributes:
      label: What role did you land?
      placeholder: "e.g., Senior Backend Engineer, Product Manager, ML Engineer"
    validations:
      required: true
  - type: input
    id: company_type
    attributes:
      label: Company type
      placeholder: "e.g., startup, big tech, agency, remote-first"
  - type: textarea
    id: story
    attributes:
      label: Your story
      description: How did career-ops help? What features made the difference?
      placeholder: "e.g., I evaluated 50+ listings, the scoring helped me focus on 3 real matches, generated tailored CVs for each..."
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Most useful feature
      options:
        - A-F Evaluation scoring
        - PDF / CV generation
        - Portal scanner
        - Interview prep (STAR stories)
        - Batch processing
        - Follow-up tracker
        - Ghost job detection (Block G)
        - Other
    validations:
      required: true
  - type: input
    id: listings_evaluated
    attributes:
      label: How many listings did you evaluate?
      placeholder: "e.g., 30, 100, 500+"
  - type: input
    id: time_to_hire
    attributes:
      label: Time from first scan to offer
      placeholder: "e.g., 2 weeks, 1 month, 3 months"
  - type: textarea
    id: advice
    attributes:
      label: One tip for others
      description: What would you tell someone just starting their job search with career-ops?
  - type: input
    id: location
    attributes:
      label: Where (optional)
      placeholder: "e.g., Spain, Berlin, remote EU, remote US"
  - type: dropdown
    id: anonymity
    attributes:
      label: How should we show you on the wall?
      description: Your choice, never defaulted to the most exposed. See HIRED.md for what each looks like.
      options:
        - Role and location only, no handle
        - With my GitHub handle (full credit)
        - Just count me, no card
    validations:
      required: true
  - type: checkboxes
    id: permission
    attributes:
      label: Permission
      options:
        - label: I'm happy for this story to appear publicly on the Hired Wall (HIRED.md), the README and release notes. I can ask to withdraw it at any time and my number stays counted.
          required: false
