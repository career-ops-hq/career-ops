version: 2
updates:
  # Dependabot does not recurse into nested manifests, so every tracked
  # package.json is listed (#4899).
  - package-ecosystem: "npm"
    directories: ["/", "/web", "/scaffolder"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gomod"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
