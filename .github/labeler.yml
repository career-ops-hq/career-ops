"🔴 core-architecture":
  - changed-files:
      - any-glob-to-any-file:
          - AGENTS.md
          - modes/_community-asks.md
          - modes/_files.md
          - modes/_headless.md
          - modes/_markets.md
          - modes/_onboarding.md
          - modes/_tracker-tsv.md
          - CLAUDE.md
          - OPENCODE.md
          - DATA_CONTRACT.md
          - modes/_shared.md

"⚠️ agent-behavior":
  - changed-files:
      - any-glob-to-any-file:
          - modes/*.md
          - modes/**/*.md
          # The router every CLI skill directory below symlinks to. A PR that
          # edits it changes only this path, never the symlinks.
          - .agents/skills/**
          - .claude/skills/**
          - .opencode/skills/**
          - .qwen/skills/**
          - .antigravitycli/skills/**
          - .grok/skills/**
          - .kimi/skills/**
          # The thin plugin for the Claude plugin directory carries a copy of the router.
          - claude-directory/skills/**
          # The thin plugin for the OpenAI plugin directory carries one too.
          - openai-directory/skills/**
          # And the thin plugin for the Cursor Marketplace.
          - cursor-directory/skills/**
          # And the thin plugin for the Antigravity Marketplace.
          - antigravity-directory/skills/**

"🔧 scripts":
  - changed-files:
      - any-glob-to-any-file:
          - "*.mjs"
          - batch/**

"📄 docs":
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "README*.md"
          - CONTRIBUTING.md
          - GOVERNANCE.md
          - CODE_OF_CONDUCT.md
          - SECURITY.md
          - SUPPORT.md

"🌐 i18n":
  - changed-files:
      - any-glob-to-any-file:
          - "README.*.md"
          # One entry per translation directory, as listed by lib/mode-sets.mjs.
          # The market sets (modes/at/, modes/in/, modes/sg/) are English, not
          # translations, so they stay out; agent-behavior labels them.
          # tests/labeler-globs.test.mjs fails when a directory is added or dropped.
          - modes/ar/**
          - modes/da/**
          - modes/de/**
          - modes/es/**
          - modes/fr/**
          - modes/hi/**
          - modes/id/**
          - modes/it/**
          - modes/ja/**
          - modes/ko/**
          - modes/nb/**
          - modes/nl/**
          - modes/pl/**
          - modes/pt/**
          - modes/ru/**
          - modes/tr/**
          - modes/ua/**
          - modes/vi/**
          - modes/zh/**
          - modes/zh-TW/**

"📊 dashboard":
  - changed-files:
      - any-glob-to-any-file:
          - dashboard/**

"📦 dependencies":
  - changed-files:
      - any-glob-to-any-file:
          # The root package-lock.json is gitignored (d01925e9), so it is not
          # listed. tests/labeler-globs.test.mjs checks this list against the
          # tracked manifests and lockfiles.
          - package.json
          - dashboard/go.mod
          - dashboard/go.sum
          - scaffolder/package.json
          - web/package.json
          - web/package-lock.json

"⚙️ ci":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
