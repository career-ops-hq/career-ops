name: Approve CI for fork PRs

# Cada 30 min aprueba los runs de tests que esperan aprobación (política de Actions
# `first_time_contributors`), con reglas fijas (.github/scripts/ci-approve.mjs):
#   - pagina TODOS los runs `action_required` y los agrupa por head_sha en local
#   - aprueba solo si la PR está abierta, el run es del head actual, el autor no es bot,
#     y la PR no toca .github/workflows/** ni ningún package*.json
#   - tope 20 SHAs por ejecución
#
# Token: `CI_APPROVE_TOKEN` si está definido; si no, `GITHUB_TOKEN` con `actions: write`, que aprueba como github-actions[bot]
# (comprobado el 23-sep). Un 403 de permisos para la pasada y la deja en rojo, sin reintentar con el otro token; un límite de tasa
# la para sin rojo y la siguiente reintenta. CI_APPROVE_TOKEN tiene prioridad y firma las aprobaciones: déjalo sin definir, o pon
# solo un token que no sea de una persona (GitHub App). Con un PAT personal, cada aprobación saldría a nombre de su dueño.
# vars.TRIAGE_DRY_RUN = "true" -> solo informa en el job summary.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: ci-approve
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Approve pending runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_APPROVE_TOKEN: ${{ secrets.CI_APPROVE_TOKEN }}
          DRY_RUN: ${{ vars.TRIAGE_DRY_RUN }}
        run: node .github/scripts/ci-approve.mjs
