name: Hosted engine adapter

on:
  push:
    branches: [product/hosted-foundation]
  pull_request:
    paths:
      - hosted/**
      - .github/workflows/hosted-engine.yml
      - openai-eval.mjs
      - merge-tracker.mjs
      - tracker-parse.mjs
      - lib/**
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix hosted test
      - run: node validate-system-paths-coverage.mjs
