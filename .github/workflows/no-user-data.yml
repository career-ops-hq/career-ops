name: No user data in PRs

# Hard-blocks any PR that adds or modifies user-layer (private data) files.
# These live ONLY on the candidate's machine per DATA_CONTRACT.md and must never
# enter the repo — they are personal job-search data. Sample/fixture data belongs
# under examples/. Tracked scaffolding (.gitkeep keepers, dir READMEs) is exempt.
# Overlaps USER_PATHS in update-system.mjs without mirroring it: that list says
# what an update must never overwrite, this one says what must never enter the
# repo. batch/ is where the two part company - its tracked scripts are shipped
# by the system, so they are SYSTEM_PATHS there, while the worker output written
# beside them is private data (#4531). Uses the API (listFiles) so it works for
# fork PRs too.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });

            // User-layer paths from DATA_CONTRACT.md and update-system.mjs.
            // Every update-system.mjs USER_PATHS entry must be blocked here
            // unless tests/no-user-data-batch-guard.test.mjs allowlists it with
            // a reason (#4891). Omitted on purpose: voice-dna.md ships as a
            // populated system default, so edits to it are legit; .claude/
            // settings.json and .claude/hooks/ are project harness config that
            // is not gitignored and may legitimately be committed.
            const USER_PATHS = [
              /^cv\.md$/,
              /^config\/profile\.yml$/,
              /^config\/plugins\.yml$/,
              /^modes\/_profile\.md$/,
              /^modes\/_custom\.md$/,
              /^modes\/_brief\.md$/,
              /^portals\.yml$/,
              /^article-digest\.md$/,
              /^opencode\.json$/,
              /^plugins\.lock$/,
              /^plugins\.local\//,
              /^\.career-ops-web\//,
              /^documents\//,
              /^interview-prep\//,
              /^data\//,
              /^reports\//,
              /^output\//,
              /^jds\//,
              /^writing-samples\//,
              /^batch\//,
            ];
            // Tracked scaffolding that legitimately lives under those dirs.
            //
            // batch/ gets an exact allowlist instead of the filename rule. The
            // workers write user-layer output into it (tailored CV and
            // cover-letter JSON, prefetched JD text, per-run state), and a
            // filename-shaped exemption is exactly what that output can be
            // named: a worker scratch dir may hold a README.md, and nothing
            // stops private content being committed as batch/tmp/README.md or
            // batch/anything/.gitkeep. So under batch/ a path is exempt only by
            // being on this list, which also means a new tracked file there has
            // to be added on purpose.
            //
            // Everywhere else the filename rule stands: data/, reports/, jds/,
            // output/, documents/, interview-prep/ and writing-samples/ track
            // real .gitkeep keepers and dir READMEs, and narrowing this globally
            // would fail every PR that touches one.
            const BATCH_SOURCES = new Set([
              'batch/README.md',
              'batch/aggregate-tokens.mjs',
              'batch/batch-prompt.md',
              'batch/batch-runner.sh',
              'batch/logs/.gitkeep',
              'batch/tracker-additions/.gitkeep',
            ]);
            const isScaffold = (f) =>
              f.startsWith('batch/')
                ? BATCH_SOURCES.has(f)
                : /(^|\/)\.gitkeep$/.test(f) || /(^|\/)README\.md$/.test(f);

            const bad = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename)
              .filter((f) => USER_PATHS.some((re) => re.test(f)) && !isScaffold(f));

            if (bad.length) {
              core.setFailed(
                'This PR adds/modifies user-layer (private data) files. These live ONLY on your ' +
                'machine per DATA_CONTRACT.md and must never be committed — use examples/ for ' +
                'sample data.\nOffending files:\n  ' + bad.join('\n  ')
              );
            } else {
              core.info('OK — no user-layer (private data) files touched.');
            }
