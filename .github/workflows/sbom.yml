name: SBOM Generation
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sbom:
    # Only career-ops releases: web-vX.Y.Z is the sibling component, and the
    # repository-wide SBOM attached to it described the wrong thing. Since
    # releases are created with the release App's token (release.yml), they
    # trigger this workflow; with GITHUB_TOKEN they never did.
    if: ${{ startsWith(github.event.release.tag_name, 'career-ops-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: career-ops-sbom.spdx.json
          format: spdx-json
          output-file: career-ops-sbom.spdx.json
          # The step below uploads it, once. With the action's default (true)
          # the file was already attached and `gh release upload` failed with
          # "asset under the same name already exists" on every release.
          upload-release-assets: false

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # --clobber: a re-run replaces the asset instead of failing on it.
        run: gh release upload "$TAG" career-ops-sbom.spdx.json --clobber --repo "$GITHUB_REPOSITORY"
