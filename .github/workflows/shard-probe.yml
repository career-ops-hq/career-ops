name: Shard probe (temporary)

# TEMPORARY, removed before this PR is ready: the shard and gate jobs of
# test.yml run only in the merge queue, which a pull request never triggers.
# This copy runs them on the PR so they are seen working on real macOS and
# Windows runners, and timed, before anything depends on them. Gate names are
# changed so they cannot be mistaken for the required checks.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

  changes:
    name: Classify the change
    # Answers one question for the jobs below: does this PR or merge queue entry
    # change only docs? A job of its own so that one diff decides for all of them.
    # Its failure is not a way to lose checks: they read an empty answer as "not
    # docs-only".
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR's test merge with its parents, the first being the PR's base. In
          # the merge queue, the entry's squash commit with its parent, the base.
          fetch-depth: 2
          persist-credentials: false
      # The classifier that decides whether to skip four jobs and two OS legs must
      # not be one the PR can edit: a PR that rewrote docs-only-change.mjs to always
      # answer "docs only" would skip its own checks on itself. Run the BASE
      # branch's copy against the PR's diff instead. It reads the diff from the
      # working directory (the PR checkout above) and imports its helpers relative
      # to itself, so the base copy of every module it loads comes with it. This
      # step goes AFTER the PR checkout, which cleans the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request: the target branch name. merge_group: base_ref is empty,
          # so pin the commit the group was built on.
          ref: ${{ github.base_ref || github.event.merge_group.base_sha }}
          path: base
          persist-credentials: false
      - id: classify
        run: node base/.github/scripts/docs-only-change.mjs
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}

  suite-macos:
    name: suite (macos-latest, ${{ matrix.shard }}/2)
    # macOS in the merge queue, split 2 ways (test-all.mjs --shard,
    # tests/shard.mjs). Not on a pull request, and not for a
    # docs-only change: the job is skipped whole, so no macOS runner is
    # taken. A failed classifier runs it.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      # One shard failing must not cancel the others' evidence.
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # The repo is committed with LF; Windows runners default to autocrlf,
      # which would rewrite every text file on checkout and make regexes that
      # rely on `.` (no \r) fail in ways the other platforms never see.
      - name: Force LF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test code (fork code, in a merge_group) must not find a token in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: ${{ matrix.shard == 1 }}
        with:
          go-version: '1.27'
          # The module lives in dashboard/, so without this setup-go looks for
          # go.sum at the root, warns, and caches nothing.
          cache-dependency-path: dashboard/go.sum
      # The Go dashboard tests need only Go and take 40-60 s, most of it the
      # cross-compile in cross_compile_test.go. Started here, in the background,
      # they run while Node is set up and the dependencies install, instead of
      # after the suite. "Go dashboard tests" below waits for them and ends with
      # their exit code, so a failing Go test still turns this check red. They
      # write only to their own temp dirs, so the suite never sees them. Shard 1 only.
      - name: Start the Go dashboard tests in the background
        id: go_start
        if: ${{ matrix.shard == 1 }}
        shell: bash
        working-directory: dashboard
        run: |
          out="$(cd "$RUNNER_TEMP" && pwd)"
          nohup bash -c 'go test ./... > "$1/go-test.log" 2>&1; echo "$?" > "$1/go-test.exit"' _ "$out" > /dev/null 2>&1 &
      # The declared floor (lib/node-floor.mjs, package.json engines). Exact on
      # purpose: a bare '22' resolves to the newest 22.x and tests nothing.
      # Renovate is told to leave node-version in this file alone (renovate.json);
      # tests/node-floor.test.mjs fails if this drifts from NODE_MIN.
      - name: Set up the Node floor (22.13) for syntax compatibility
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13'
      - run: npm run lint
      - name: Set up Node 24 for the test suite
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Skip the postinstall (npx playwright install chromium): the ~170 MB
      # download on three OSes would buy only the few suites that launch a
      # browser, and those skip here and run in the tool-suites job instead.
      - run: npm install --ignore-scripts
      - run: node test-all.mjs --quick --shard "${{ matrix.shard }}/2"
      # Waits for the run started above and reports it as its own step. Runs
      # after a red suite too (!cancelled()), so one failure does not hide the
      # other; not when the start step did not run, which would wait for
      # nothing.
      - name: Go dashboard tests
        if: ${{ !cancelled() && steps.go_start.outcome == 'success' }}
        shell: bash
        run: |
          out="$(cd "$RUNNER_TEMP" && pwd)"
          # 10 minutes: far past the 40-60 s these take, inside the job's limit.
          for _ in $(seq 600); do [ -s "$out/go-test.exit" ] && break; sleep 1; done
          cat "$out/go-test.log" 2>/dev/null || true
          if [ ! -s "$out/go-test.exit" ]; then
            echo "::error::The Go dashboard tests started in the background did not finish within 10 minutes."
            exit 1
          fi
          exit "$(cat "$out/go-test.exit")"


  suite-windows:
    name: suite (windows-latest, ${{ matrix.shard }}/3)
    # Windows in the merge queue, split 3 ways (test-all.mjs --shard,
    # tests/shard.mjs). Three, not two: the same suites take about twice as long as on Ubuntu (tests/helpers.mjs, NODE_TEST_BUDGET_FACTOR). Not on a pull request, and not for a
    # docs-only change: the job is skipped whole, so no Windows runner is
    # taken. A failed classifier runs it.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      # One shard failing must not cancel the others' evidence.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # The repo is committed with LF; Windows runners default to autocrlf,
      # which would rewrite every text file on checkout and make regexes that
      # rely on `.` (no \r) fail in ways the other platforms never see.
      - name: Force LF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test code (fork code, in a merge_group) must not find a token in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: ${{ matrix.shard == 1 }}
        with:
          go-version: '1.27'
          # The module lives in dashboard/, so without this setup-go looks for
          # go.sum at the root, warns, and caches nothing.
          cache-dependency-path: dashboard/go.sum
      # The Go dashboard tests need only Go and take 40-60 s, most of it the
      # cross-compile in cross_compile_test.go. Started here, in the background,
      # they run while Node is set up and the dependencies install, instead of
      # after the suite. "Go dashboard tests" below waits for them and ends with
      # their exit code, so a failing Go test still turns this check red. They
      # write only to their own temp dirs, so the suite never sees them. Shard 1 only.
      - name: Start the Go dashboard tests in the background
        id: go_start
        if: ${{ matrix.shard == 1 }}
        shell: bash
        working-directory: dashboard
        run: |
          out="$(cd "$RUNNER_TEMP" && pwd)"
          nohup bash -c 'go test ./... > "$1/go-test.log" 2>&1; echo "$?" > "$1/go-test.exit"' _ "$out" > /dev/null 2>&1 &
      # The declared floor (lib/node-floor.mjs, package.json engines). Exact on
      # purpose: a bare '22' resolves to the newest 22.x and tests nothing.
      # Renovate is told to leave node-version in this file alone (renovate.json);
      # tests/node-floor.test.mjs fails if this drifts from NODE_MIN.
      - name: Set up the Node floor (22.13) for syntax compatibility
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13'
      - run: npm run lint
      - name: Set up Node 24 for the test suite
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Skip the postinstall (npx playwright install chromium): the ~170 MB
      # download on three OSes would buy only the few suites that launch a
      # browser, and those skip here and run in the tool-suites job instead.
      - run: npm install --ignore-scripts
      - run: node test-all.mjs --quick --shard "${{ matrix.shard }}/3"
      # Waits for the run started above and reports it as its own step. Runs
      # after a red suite too (!cancelled()), so one failure does not hide the
      # other; not when the start step did not run, which would wait for
      # nothing.
      - name: Go dashboard tests
        if: ${{ !cancelled() && steps.go_start.outcome == 'success' }}
        shell: bash
        run: |
          out="$(cd "$RUNNER_TEMP" && pwd)"
          # 10 minutes: far past the 40-60 s these take, inside the job's limit.
          for _ in $(seq 600); do [ -s "$out/go-test.exit" ] && break; sleep 1; done
          cat "$out/go-test.log" 2>/dev/null || true
          if [ ! -s "$out/go-test.exit" ]; then
            echo "::error::The Go dashboard tests started in the background did not finish within 10 minutes."
            exit 1
          fi
          exit "$(cat "$out/go-test.exit")"


  test-macos:
    # The required check "test (macos-latest)". It runs no tests itself: it passes
    # when every suite-macos shard passed, so the check means what it meant when
    # one job ran the whole suite. On a pull request, or for a docs-only
    # change, the shards are skipped on purpose and this says so; a skip for
    # any other reason is a failure. Runs on Ubuntu, so it never waits for a
    # macOS runner.
    name: probe gate (macos-latest)
    needs: [changes, suite-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every macOS shard passed
        shell: bash
        env:
          RESULT: ${{ needs.suite-macos.result }}
          MAY_SKIP: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: |
          case "$RESULT" in
            success) echo "Every macOS shard of the suite passed." ;;
            skipped)
              if [ "$MAY_SKIP" = true ]; then
                echo "Not run here: on a pull request the macOS leg runs in the merge queue, and a docs-only change does not need it."
              else
                echo "::error::The macOS shards were skipped in a run that needs them."
                exit 1
              fi ;;
            *) echo "::error::The macOS shards ended '$RESULT'. Open the failing 'suite (macos-latest, n/N)' job for the failure."; exit 1 ;;
          esac

  test-windows:
    # The required check "test (windows-latest)". It runs no tests itself: it passes
    # when every suite-windows shard passed, so the check means what it meant when
    # one job ran the whole suite. On a pull request, or for a docs-only
    # change, the shards are skipped on purpose and this says so; a skip for
    # any other reason is a failure. Runs on Ubuntu, so it never waits for a
    # Windows runner.
    name: probe gate (windows-latest)
    needs: [changes, suite-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows shard passed
        shell: bash
        env:
          RESULT: ${{ needs.suite-windows.result }}
          MAY_SKIP: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: |
          case "$RESULT" in
            success) echo "Every Windows shard of the suite passed." ;;
            skipped)
              if [ "$MAY_SKIP" = true ]; then
                echo "Not run here: on a pull request the Windows leg runs in the merge queue, and a docs-only change does not need it."
              else
                echo "::error::The Windows shards were skipped in a run that needs them."
                exit 1
              fi ;;
            *) echo "::error::The Windows shards ended '$RESULT'. Open the failing 'suite (windows-latest, n/N)' job for the failure."; exit 1 ;;
          esac

