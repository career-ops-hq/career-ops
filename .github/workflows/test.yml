          out="$(cd "$RUNNER_TEMP" && pwd)"
          nohup bash -c 'go test ./... > "$1/go-test.log" 2>&1; echo "$?" > "$1/go-test.exit"' _ "$out" > /dev/null 2>&1 &
      - run: node test-all.mjs --quick --shard "${{ matrix.shard }}/2"
      # Waits for the run started above and reports it as its own step. Runs
      # after a red suite too (!cancelled()), so one failure does not hide the
      # other; not when the start step did not run, which would wait for
      # nothing.
      - name: Go dashboard tests
        if: ${{ !cancelled() && steps.go_start.outcome == 'success' }}
        shell: bash
        run: |
          out="$(cd "$RUNNER_TEMP" && pwd)"
          # 10 minutes: far past the 40-60 s these take, inside the job's limit.
          for _ in $(seq 600); do [ -s "$out/go-test.exit" ] && break; sleep 1; done
          cat "$out/go-test.log" 2>/dev/null || true
          if [ ! -s "$out/go-test.exit" ]; then
            echo "::error::The Go dashboard tests started in the background did not finish within 10 minutes."
            exit 1
          fi
          exit "$(cat "$out/go-test.exit")"


  suite-windows:
    name: suite (windows-latest, ${{ matrix.shard }}/3)
    # Windows in the merge queue, split 3 ways (test-all.mjs --shard,
    # tests/shard.mjs). Three, not two: the same suites take about twice as long as on Ubuntu (tests/helpers.mjs, NODE_TEST_BUDGET_FACTOR). Not on a pull request, and not for a
    # docs-only change: the job is skipped whole, so no Windows runner is
    # taken. A failed classifier runs it.
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      # One shard failing must not cancel the others' evidence.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # The repo is committed with LF; Windows runners default to autocrlf,
      # which would rewrite every text file on checkout and make regexes that
      # rely on `.` (no \r) fail in ways the other platforms never see.
      - name: Force LF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test code (fork code, in a merge_group) must not find a token in .git/config.
          persist-credentials: false
      # The declared floor (lib/node-floor.mjs, package.json engines). Exact on
      # purpose: a bare '22' resolves to the newest 22.x and tests nothing.
      # Renovate is told to leave node-version in this file alone (renovate.json);
      # tests/node-floor.test.mjs fails if this drifts from NODE_MIN.
      - name: Set up the Node floor (22.13) for syntax compatibility
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13'
      - run: npm run lint
      - name: Set up Node 24 for the test suite
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Skip the postinstall (npx playwright install chromium): the ~170 MB
      # download on three OSes would buy only the few suites that launch a
      # browser, and those skip here and run in the tool-suites job instead.
      - run: npm install --ignore-scripts
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: ${{ matrix.shard == 1 }}
        with:
          go-version: '1.27'
          # The module lives in dashboard/, so without this setup-go looks for
          # go.sum at the root, warns, and caches nothing.
          cache-dependency-path: dashboard/go.sum
      # The Go dashboard tests take 40-60 s, most of it the cross-compile in
      # cross_compile_test.go. Started here, in the background, they run at the
      # same time as the suite instead of after it. Not earlier: some of them
      # run the repo's Node scripts (set-status.mjs), which need Node 24 and the
      # installed dependencies. "Go dashboard tests" below waits for them and ends with
      # their exit code, so a failing Go test still turns this check red. They
      # write only to their own temp dirs, so the suite never sees them. Shard 1 only.
      - name: Start the Go dashboard tests in the background
        id: go_start
        if: ${{ matrix.shard == 1 }}
        shell: bash
        working-directory: dashboard
        run: |
          out="$(cd "$RUNNER_TEMP" && pwd)"
          nohup bash -c 'go test ./... > "$1/go-test.log" 2>&1; echo "$?" > "$1/go-test.exit"' _ "$out" > /dev/null 2>&1 &
      - run: node test-all.mjs --quick --shard "${{ matrix.shard }}/3"
      # Waits for the run started above and reports it as its own step. Runs
      # after a red suite too (!cancelled()), so one failure does not hide the
      # other; not when the start step did not run, which would wait for
      # nothing.
      - name: Go dashboard tests
        if: ${{ !cancelled() && steps.go_start.outcome == 'success' }}
        shell: bash
        run: |
          out="$(cd "$RUNNER_TEMP" && pwd)"
          # 10 minutes: far past the 40-60 s these take, inside the job's limit.
          for _ in $(seq 600); do [ -s "$out/go-test.exit" ] && break; sleep 1; done
          cat "$out/go-test.log" 2>/dev/null || true
          if [ ! -s "$out/go-test.exit" ]; then
            echo "::error::The Go dashboard tests started in the background did not finish within 10 minutes."
            exit 1
          fi
          exit "$(cat "$out/go-test.exit")"


  test-macos:
    # The required check "test (macos-latest)". It runs no tests itself: it passes
    # when every suite-macos shard passed, so the check means what it meant when
    # one job ran the whole suite. On a pull request, or for a docs-only
    # change, the shards are skipped on purpose and this says so; a skip for
    # any other reason is a failure. Runs on Ubuntu, so it never waits for a
    # macOS runner.
    name: test (macos-latest)
    needs: [changes, suite-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every macOS shard passed
        shell: bash
        env:
          RESULT: ${{ needs.suite-macos.result }}
          MAY_SKIP: ${{ github.event_name == 'pull_request' || needs.changes.outputs.docs_only == 'true' }}
        run: |
          case "$RESULT" in
            success) echo "Every macOS shard of the suite passed." ;;
            skipped)
              if [ "$MAY_SKIP" = true ]; then
                echo "Not run here: on a pull request the macOS leg runs in the merge queue, and a docs-only change does not need it."
              else
                echo "::error::The macOS shards were skipped in a run that needs them."
                exit 1
              fi ;;
            *) echo "::error::The macOS shards ended '$RESULT'. Open the failing 'suite (macos-latest, n/N)' job for the failure."; exit 1 ;;
          esac

  test-windows:
    # The required check "test (windows-latest)". It runs no tests itself: it passes
    # when every suite-windows shard passed, so the check means what it meant when
    # one job ran the whole suite. On a pull request, or for a docs-only
    # change, the shards are skipped on purpose and this says so; a skip for
    # any other reason is a failure. Runs on Ubuntu, so it never waits for a
    # Windows runner.
    name: test (windows-latest)
    needs: [changes, suite-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows shard passed
        shell: bash
        env:
          RESULT: ${{ needs.suite-windows.result }}
          MAY_SKIP: ${{ github.event_name == 'pull_request' || needs.changes.outputs.docs_only == 'true' }}
        run: |
          case "$RESULT" in
            success) echo "Every Windows shard of the suite passed." ;;
            skipped)
              if [ "$MAY_SKIP" = true ]; then
                echo "Not run here: on a pull request the Windows leg runs in the merge queue, and a docs-only change does not need it."
              else
                echo "::error::The Windows shards were skipped in a run that needs them."
                exit 1
              fi ;;
            *) echo "::error::The Windows shards ended '$RESULT'. Open the failing 'suite (windows-latest, n/N)' job for the failure."; exit 1 ;;
          esac

  cv-visual:
    # Not a required check, so the merge queue never waits on it: a red queue
    # run blocks nothing (14 failed in Oct-2026 and every one of those PRs
    # merged on that same attempt). It still runs on every PR, where a red
    # result is seen before the PR is queued (#5723).
    needs: changes
    # Skipped for a docs-only PR too: nothing this job checks depends on what a
    # docs file says (#6402). !cancelled() so that a failed `changes` still runs
    # the job.
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # About 3 minutes, image build included. Limited for the test job's reason.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the canonical CV rendering environment
        run: docker build --platform linux/amd64 --tag career-ops-cv-visual tests/cv-visual
      - name: Check every CV template and PDF page
        run: |
          docker run --rm --init --ipc=host --platform linux/amd64 \
            --volume "$PWD:/work" --volume /work/node_modules \
            career-ops-cv-visual \
            sh -c 'npm install --ignore-scripts --package-lock=false && npm run test:cv-visual'
      - name: Upload CV visual diffs and rendered previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv-visual-artifacts
          path: |
            test-results/cv-visual-artifacts/
            test-results/cv-visual-results/
          if-no-files-found: ignore
  tool-suites:
    name: Browser and LaTeX suites
    # The test job installs no browser and no TeX engine, so the suites that
    # need one skip there and their checks ran on no job (#5756, #5758). This
    # runs them in the cv-visual image, which has Chromium, Poppler and the CJK
    # fonts; tectonic comes from the repo's pinned, checksummed installer and
    # fetches its TeX bundle on the first compile. `--needs` selects the suites
    # that declare those tools (tests/required-tools.mjs) and turns a missing
    # tool into a failure instead of a skip. A job of its own rather than a
    # step in cv-visual, so its result has its own check. Not a required
    # check, so the merge queue would gain nothing from running it again.
    needs: changes
    # Skipped on a docs-only PR for the reason given on cv-visual.
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # Image build plus the TeX bundle download. Limited for the test job's reason.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the canonical CV rendering environment
        run: docker build --platform linux/amd64 --tag career-ops-cv-visual tests/cv-visual
      - name: Run the suites that need Chromium or a TeX engine
        run: |
          docker run --rm --init --ipc=host --platform linux/amd64 \
            --volume "$PWD:/work" --volume /work/node_modules \
            career-ops-cv-visual \
            sh -c 'npm install --ignore-scripts --package-lock=false && node install-latex-engine.mjs && node test-all.mjs --needs browser,latex'
  upgrade-gate:
    name: Upgrade regression gate
    # Skipped in the merge queue for cv-visual's reason above.
    needs: changes
    # Skipped on a docs-only PR for the reason given on cv-visual.
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # About 3 minutes. Limited for the test job's reason.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # harness needs release tags
          persist-credentials: false # the harness only ever touches a local mirror
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'   # old updaters rebuild the dashboard during apply
          cache-dependency-path: dashboard/go.sum
      - run: npm install --ignore-scripts
      - name: Upgrade PR gate (newest old release -> this commit)
        run: node upgrade-tests.mjs --pr-gate
      - name: Canary (harness must be able to fail)
        run: node upgrade-tests.mjs --canary
      - name: Local-paths declaration survives a real apply (#2421)
        run: node upgrade-tests.mjs --local-paths
      - name: User-layer manifest entry is refused, not fatal (#3782)
        run: node upgrade-tests.mjs --user-layer-refusal
      - name: Failed npm install is reported, rollback reinstalls
        run: node upgrade-tests.mjs --failed-install
      - name: A locally edited system file is kept, and replaced only with --force (#2337)
        run: node upgrade-tests.mjs --local-edit
      - name: Local-edit canary (an inverted --force branch must go red)
        run: node upgrade-tests.mjs --local-edit-canary

  dependency-audit:
    name: Dependency audit
    # Informative by design: the root has no tracked lockfile (ranges resolve
    # at install time), so a newly published advisory in a third-party range
    # must not turn required checks red on unrelated PRs (#5897).
    needs: changes
    # Skipped on a docs-only PR for the reason given on cv-visual.
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm audit --audit-level=high
