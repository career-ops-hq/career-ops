name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The doctor parity test runs the real core doctor.mjs, which imports the
      # core's own dependencies (js-yaml, dotenv). Installed the same way as
      # test.yml: no lockfile at the root, and no browser download.
      - name: Install core dependencies
        run: npm install --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
