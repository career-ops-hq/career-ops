name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # web/tests/lib/tracker-lock.test.mjs imports the core tracker lock from
      # the repo root to assert the real primitive rather than a copy of it —
      # which is what lets that test survive a change of caller. The root module
      # pulls in js-yaml, so the root install has to happen or the dynamic
      # import throws and every web PR shows a failure that is not its own.
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
