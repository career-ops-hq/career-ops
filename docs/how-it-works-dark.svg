  <text x="380" y="145" text-anchor="middle" font-size="13.5" fill="#9198a1">Classifies: LLMOps / Agentic / PM / SA / FDE / Transformation</text>
  <line x1="380" y1="164" x2="380" y2="189" stroke="#6e7681" stroke-width="2"/><path d="M374 187 L386 187 L380 196 Z" fill="#6e7681"/>
