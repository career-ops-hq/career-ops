<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="hiw-title">
  <title id="hiw-title">How it works: you paste a job URL or description. Archetype Detection classifies it as LLMOps, Agentic, PM, SA, FDE or Transformation. The A-H Evaluation reads cv.md and covers match, gaps, comp research, STAR stories and legitimacy. It produces a report (reports/*.md), the tailored CV in the format set by cv.output_format — a PDF by default — and a tracker entry (data/applications.md).</title>
  <rect width="760" height="404" rx="12" fill="#0d1117"/>
  <rect x="200" y="16" width="360" height="44" rx="22" fill="#0d1117" stroke="#DD7627" stroke-width="2"/>
  <text x="380" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">You paste a job URL or description</text>
