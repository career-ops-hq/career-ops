  <rect x="100" y="196" width="6" height="72" fill="#DD7627" clip-path="url(#clip196)"/>
  <text x="380" y="226" text-anchor="middle" font-size="17" fill="#e6edf3"><tspan font-weight="700">A-H Evaluation</tspan><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#9198a1">  reads cv.md</tspan></text>
  <text x="380" y="249" text-anchor="middle" font-size="13.5" fill="#9198a1">Match, gaps, comp research, STAR stories, legitimacy</text>
