# portals-tsmc.yml — starting entries for the TSMC search.
# 台積電求職用的 portals.yml 起始設定。
#
# Copy the entry you need under `tracked_companies:` in your own portals.yml
# (portals.yml is user layer and gitignored). Then run:
# 把需要的項目複製到你自己 portals.yml 的 `tracked_companies:` 底下，然後執行：
#
#   node audit-portals.mjs --summary
#
# VERIFIED 2026-09-26: TSMC's careers site runs on Avature, behind Cloudflare.
# From a cloud session only a real (non-headless) browser gets through, so the
# plain-HTTP Avature provider may be challenged there. From a home connection in
# Taiwan, try option B and confirm with the audit. See fork-notes/tsmc/journal.md.
# 已驗證（2026-09-26）：台積電徵才網站使用 Avature，前面有 Cloudflare。
# 在雲端工作階段只有真正的（非 headless）瀏覽器能通過，一般 HTTP 的 Avature 串接程式可能被擋。
# 在台灣的家用網路下，可以試選項 B，再用稽核確認。詳見 fork-notes/tsmc/journal.zh-TW.md。

tracked_companies:

  # Option A — works whatever the ATS is: search-engine discovery.
  # 選項 A：不管背後是哪套 ATS 都能用，透過搜尋引擎找職缺。
  - name: TSMC
    careers_url: https://careers.tsmc.com/
    scan_method: websearch
    scan_query: 'site:careers.tsmc.com "Engineer" OR "工程師"'
    enabled: true

  # Option B — the Avature provider (confirmed ATS). Works only where Cloudflare
  # lets plain HTTP through; confirm with the audit.
  # Keep only one of A/B enabled.
  # 選項 B：Avature 串接程式（已確認的 ATS）。只有在 Cloudflare 放行一般 HTTP 請求時才有效，請用稽核確認。A、B 只保留一個 enabled。
  # - name: TSMC
  #   careers_url: https://careers.tsmc.com/
  #   provider: avature
  #   api: https://careers.tsmc.com/en_US/careers/SearchJobs
  #   max_pages: 50
  #   enabled: true

# 104 人力銀行: no provider. Paste posting URLs or JD text into the chat instead.
# 104 人力銀行：沒有串接程式，請把職缺網址或 JD 文字直接貼進對話。
