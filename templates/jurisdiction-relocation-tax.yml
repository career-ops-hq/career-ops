# Career-Ops — Interprovincial/Interstate Relocation Tax Bands (jurisdiction table) (#4694)
#
# Part of the jurisdiction-compliance-lens umbrella (#2026), member "Interprovincial/
# interstate relocation — real purchasing power". Consumed by salary-gap.mjs's
# relocation-adjustment functions (loadRelocationTable / matchJurisdiction /
# computeRelocationAdjustment) and surfaced in modes/oferta.md Block G, Signal 17.
#
# This file is a DATA REFERENCE, not instruction logic: adding a new jurisdiction
# (another province, a US state) never requires touching salary-gap.mjs's math —
# only a new entry here, following the schema below. The engine is generic
# (federal brackets + sub-national brackets -> progressive bracket tax), the
# table is jurisdiction-keyed. Canada is the first seed, not a hardcoded ceiling —
# the same pattern the AI-screening-disclosure table used (NYC/Illinois/EU) and
# the covenant table used (California first, Ontario second).
#
# CONTRIBUTION RULE (mandatory, same discipline as every other jurisdiction table
# in this repo): no entry/bracket lands here without
#   1. a regulator-grade citable source (the tax authority's own published rate
#      table, or a reputable accounting-firm bulletin summarizing it with an
#      explicit tax year), AND
#   2. an explicit `tax_year` the brackets apply to, AND
#   3. an `as_of` date recording when the row was last verified, AND
#   4. an `official_source.url` pointing at the tax authority's OFFICIAL page —
#      never a third-party mirror, scraped cost-of-living site, or aggregator.
# Unverified or "I heard the rate is..." rows will be rejected in review.
#
# NEVER-ASSERT / PHRASING-DISCIPLINE RULE (mandatory, mirrored in modes/oferta.md
# Signal 17): rows here compute a SIMPLIFIED, TRANSPARENT tax-bracket figure —
# federal + sub-national MARGINAL BRACKETS ONLY, applied progressively. They do
# NOT model basic personal amounts, non-refundable credits, CPP/EI/QPIP
# contributions, provincial surtaxes (e.g. Ontario's), health premiums, or any
# other credit/deduction. The output is a directional "which province keeps more
# of this gross number," never an exact take-home-pay calculation, and the
# agent/script must say so every time this table is used. NOT FINANCIAL OR TAX
# ADVICE — a corroborating data point for the candidate's own judgment, exactly
# like every other umbrella member's warn-only, human-in-the-loop posture.
#
# COST-OF-LIVING SCOPE NOTE (v1 limitation, intentional — see #4694's own text):
# this table does NOT include a cost-of-living index between cities. Statistics
# Canada's CPI measures price CHANGE over time within one city, not a relative
# price LEVEL between two cities, and no official, free, citable StatCan
# cross-city cost-of-living index was found during this table's construction.
# Shipping a cost-of-living adjustment here would mean inventing a number or
# pulling one from a scraped third-party cost-of-living site, both of which
# violate the seed-discipline rule above. Scoped out deliberately; a follow-up
# issue should pick this up only if/when a genuinely citable official source is
# found — see the candidate-rows comment block at the end of this file.
#
# Schema:
#   jurisdictions:
#     {CODE}:                      — jurisdiction code, e.g. CA-FEDERAL, CA-ON
#       jurisdiction_name: string  — human-readable name for report output
#       country: string            — country name (not code) for report output
#       level: "federal" | "provincial" | "state"
#       currency: string           — ISO 4217 code the brackets below are denominated
#                                     in (e.g. "CAD"). REQUIRED on every sub-national
#                                     row: salary-gap.mjs's computeRelocationAdjustment
#                                     refuses to run gross figures through these
#                                     brackets unless the advertised/--currency value
#                                     matches this field exactly (case-insensitive) —
#                                     an UNKNOWN or mismatched currency (e.g. a
#                                     "150k USD" posting against this CAD table)
#                                     returns `{ ok: false, reason: 'currency-mismatch' }`
#                                     rather than silently taxing the wrong number
#                                     (#4696). A row with no `currency` field skips
#                                     this check entirely (legacy/fixture tables only —
#                                     never omit it from a real jurisdiction row).
#       tax_year: integer          — the tax year these brackets apply to
#       aliases: list              — strings that identify this jurisdiction inside
#                                     a free-text location (candidate's own
#                                     config/profile.yml location, or a posting's
#                                     stated work location) — province/state names,
#                                     common abbreviations, and major cities.
#                                     Matched case-insensitively as whole words;
#                                     absence of a match is "no signal," never an
#                                     assumed non-match penalty (evidence-strength
#                                     honesty rule). federal rows carry no aliases
#                                     (they are combined with every sub-national
#                                     row of the same country, never matched
#                                     directly against a location string).
#       brackets: list             — ascending by `up_to`; each entry:
#         up_to: number|null       — upper bound of this bracket in the local
#                                     currency, or null for the top (unbounded) bracket
#         rate: number             — marginal rate as a decimal (0.145 = 14.5%)
#       official_source:
#         url: string              — the tax authority's own published rate page
#         what_it_shows: string    — what a candidate finds there
#       legal_basis: string        — statute/regulation citation
#       sources: list              — citable pages/bulletins backing the row
#       as_of: YYYY-MM-DD          — date this row was last verified against sources
#
# CANDIDATE ROWS FOR CONTRIBUTORS (suggestions only — do NOT add without the
# source + tax_year + as_of + official-source discipline above):
#   - CA-QC : Quebec — deliberately excluded from this v1. Quebec collects its
#             own provincial tax separately from the CRA (not the federal-collects-
#             for-the-province model every other included province uses) and
#             applies a federal abatement that this engine's simple
#             federal-plus-provincial bracket sum does not model. Needs its own
#             computation path, not just a new table row — verify before adding.
#   - CA-MB, CA-SK, CA-NB, CA-PE, CA-NL, CA-YT, CA-NT, CA-NU : not yet seeded;
#     real, citable 2026 rates exist (CRA publishes all of them on the same
#     federal/provincial rates page) — straightforward additions for a future PR.
#   - US-* : US state income tax bands (IRS federal + each state's own revenue
#     department) — the natural second country for this table, matching #4694's
#     own proposed scope. No US state seeded yet; verify against the state's own
#     department-of-revenue page before adding, same discipline as above.
#   - An official cost-of-living index — only if a genuinely citable, free,
#     official (not scraped-aggregator) cross-city source is found. Do not seed
#     on a plausible-looking number from a cost-of-living website.

