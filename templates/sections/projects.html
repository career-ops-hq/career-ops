<!--
  projects.html — section partial for Projects (#2183).

  Field placeholders filled per entry:
    NAME         — project name, already rendered as HTML: an <a href> link when
                   the entry has a url (a javascript: or other unsafe scheme is
                   dropped), plain escaped text otherwise. Don't wrap NAME in
                   another link.
    BADGE_BLOCK  — conditional: badge span when badge is present; omitted otherwise
    DESC_BLOCK   — conditional: description div; omitted when there is no text.
                   Text is description, or else the bullets. With no description
                   and 2+ bullets, the block repeats once per bullet, the way
                   experience renders one <li> per bullet; a single bullet fills
                   one block. Bullets are ignored when description is present.
    TECH_BLOCK   — conditional: tech div when tech is present; omitted otherwise

  Template packs: edit tag names, class names, and field order freely inside the ENTRY zone.
-->
<!--ENTRY-->
<div class="project">
  <div class="project-title">{{NAME}}{{BADGE_BLOCK}}</div>
  {{DESC_BLOCK}}
  {{TECH_BLOCK}}
</div>
<!--BADGE_BLOCK--><span class="project-badge">{{BADGE}}</span><!--/BADGE_BLOCK-->
<!--DESC_BLOCK--><div class="project-desc">{{DESC}}</div><!--/DESC_BLOCK-->
<!--TECH_BLOCK--><div class="project-tech">{{TECH}}</div><!--/TECH_BLOCK-->
<!--/ENTRY-->
