<!-- Redacted/synthetic PeopleSoft session-expired / signon redirect page.
     NO form named "win0" anywhere — this is the shape that must NOT be
     confused with a genuinely empty search result (see
     peoplesoft-search-page-empty.html). Loosely modeled on PeopleSoft's
     classic PIA signon page. -->
<!DOCTYPE html>
<html>
<head><title>Oracle PeopleSoft Sign In</title></head>
<body>
<div id="pt_loginbody">
<form name="login" id="login" method="post" action="/psc/exu1/EMPLOYEE/HRMS/?cmd=login">
<input type="hidden" name="timezoneOffset" value="0">
<input type="text" name="userid" value="">
<input type="password" name="pwd" value="">
<p>Your session has expired. Please sign in again to continue.</p>
<input type="submit" name="Submit" value="Sign In">
</form>
</div>
</body>
</html>
