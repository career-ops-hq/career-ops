<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Northwind application</title></head>
<body>
<form>
  <fieldset>
    <legend>Which Northwind benefits do you want?</legend>
    <label><input type="checkbox" name="benefits" value="health"> Health</label>
    <label><input type="checkbox" name="benefits" value="dental"> Dental</label>
  </fieldset>
  <fieldset>
    <legend>Perks</legend>
    <input type="checkbox" name="perks" value="health">
    <input type="checkbox" name="perks" value="dental" checked>
  </fieldset>
  <fieldset>
    <legend>Teams</legend>
    <label><input type="checkbox" name="teams" value="sm"> Sales, Marketing</label>
    <label><input type="checkbox" name="teams" value="eng"> Engineering</label>
  </fieldset>
  <fieldset>
    <legend>Acknowledgements</legend>
    <label><input type="checkbox" name="acks" value="cover"> Health insurance</label>
    <label><input type="checkbox" name="acks" value="privacy"> I agree to the privacy notice</label>
  </fieldset>
  <fieldset>
    <legend>Notices</legend>
    <label><input type="checkbox" name="notices" value="processing"> I agree to the privacy notice</label>
    <label><input type="checkbox" name="notices" value="sharing"> I agree to the privacy notice</label>
  </fieldset>
  <label for="consent"><input id="consent" name="consent" type="checkbox"> I agree to the privacy notice</label>
</form>
</body>
</html>
