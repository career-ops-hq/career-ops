<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture Co application</title></head>
<body>
<form>
  <div class="field">
    <p class="question">Are you authorized to work in the US?</p>
    <input type="radio" name="auth" value="Yes">
    <input type="radio" name="auth" value="No">
  </div>
  <fieldset>
    <legend>Willing to relocate?</legend>
    <label><input type="radio" name="rel" value="1"> Yes</label>
    <label><input type="radio" name="rel" value="0"> No</label>
  </fieldset>
  <div class="field">
    <label><input type="radio" name="visa" value="1"> Yes</label>
    <label><input type="radio" name="visa" value="0"> No</label>
  </div>
</form>
</body>
</html>
